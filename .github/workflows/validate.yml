name: Validate Streamlit app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app.py local_ai.py
      - name: Import runtime dependencies
        run: |
          python -c "import streamlit, supabase, supabase_auth, extra_streamlit_components, pyttsx3"
